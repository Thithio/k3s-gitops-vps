# Valores padrão. Cada ambiente sobrescreve em values-<ambiente>.yaml.

host: app.example.com
tls:
  enabled: true
  clusterIssuer: letsencrypt   # criado por platform/manifests/issuers.yaml

image:
  repository: ghcr.io/SEU_USUARIO/SUA_APP
  tag: latest                  # a esteira de CI grava aqui o SHA do commit
  pullPolicy: IfNotPresent
imagePullSecrets: []           # ex.: [{ name: registry-pull }] para imagem privada

replicas: 1
containerPort: 8000
healthPath: /healthz

# Variáveis de ambiente não secretas.
env: {}
# Secret com as variáveis secretas (criado pelo Ansible a partir do vault).
secretName: app-secrets

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

postgres:
  enabled: true                # cria um Cluster CloudNativePG e injeta DATABASE_URL
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
