apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:SEU_USUARIO/SEU_REPO.git
    targetRevision: main
    path: helm/app
    helm:
      valueFiles: [values-homolog.yaml]
  destination: { server: https://kubernetes.default.svc, namespace: app }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
    syncOptions: [CreateNamespace=true]
