apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.6.0   # platform/versions.env
      helm:
        valueFiles: [$values/platform/traefik-values.yaml]
    - repoURL: git@github.com:SEU_USUARIO/SEU_REPO.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: traefik }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
    syncOptions: [CreateNamespace=true]
