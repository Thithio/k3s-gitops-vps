apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-manifests
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: default
  source:
    repoURL: git@github.com:SEU_USUARIO/SEU_REPO.git
    targetRevision: main
    path: platform/manifests
  destination: { server: https://kubernetes.default.svc, namespace: cert-manager }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
